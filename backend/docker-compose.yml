version: '3.9'
services:
  api:
    build: .
    ports:
      - '4000:4000'
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis
    command: npm run start:dev
    volumes:
      - .:/app
      - /app/node_modules
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studiovbg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
volumes:
  postgres_data:
